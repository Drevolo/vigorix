<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vigorix">
  
  <title>Vigorix - Controle de Treino</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo">Vigorix</div>
      <div class="header-info">
        <div>
          <span id="headerDate">--/--/----</span> • <span id="headerDay">---</span>
        </div>
        <span class="treino-badge" id="headerTreino">Treino --</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <!-- Week Selector -->
    <section class="week-selector" id="weekSelector">
      <button class="week-btn" data-week="Semana 1">Semana 1</button>
      <button class="week-btn" data-week="Semana 2">Semana 2</button>
      <button class="week-btn" data-week="Semana 3">Semana 3</button>
      <button class="week-btn" data-week="Semana 4+">Semana 4+</button>
    </section>

    <!-- Progress Card -->
    <section class="progress-card">
      <div class="progress-header">
        <span>Progresso do Dia</span>
        <span id="progressText">0/15 exercícios</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
      </div>
    </section>

    <!-- Rounds Container -->
    <section class="rounds-container" id="roundsContainer">
      <!-- Rodadas serão geradas pelo JavaScript -->
    </section>

    <!-- Actions -->
    <section class="actions">
      <button class="btn btn-primary" id="btnDescanso">
        <i data-lucide="timer"></i>
        Iniciar Descanso
      </button>
      <button class="btn btn-success" id="btnFinalizar" disabled>
        <i data-lucide="check-circle"></i>
        Finalizar Treino do Dia
      </button>
    </section>
  </main>

  <!-- FAB - Histórico -->
  <a href="historico.html" class="fab" aria-label="Ver histórico">
    <i data-lucide="history"></i>
  </a>

  <!-- Modal Cronômetro -->
  <div id="timerModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Cronômetro de Descanso</h2>
        <button class="modal-close" id="timerClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="timer-display" id="timerDisplay">01:00</div>
        
        <div class="timer-presets">
          <button class="timer-preset" data-time="30">30 seg</button>
          <button class="timer-preset" data-time="40">40 seg</button>
          <button class="timer-preset active" data-time="60">1 min</button>
        </div>
        
        <div class="timer-custom">
          <input type="number" id="customTime" placeholder="Segundos (ex: 45)" min="1" max="300">
          <button class="btn btn-secondary" id="btnCustomTime" style="width: auto; padding: 0.625rem 1rem;">Aplicar</button>
        </div>
        
        <div class="timer-actions">
          <button class="btn btn-primary" id="btnTimerStart">
            <i data-lucide="play"></i>
            Iniciar
          </button>
          <button class="btn btn-secondary" id="btnTimerPause" style="display: none;">
            <i data-lucide="pause"></i>
            Pausar
          </button>
          <button class="btn btn-secondary" id="btnTimerCancel">
            <i data-lucide="x"></i>
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    lucide.createIcons();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
