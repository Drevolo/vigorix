<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0b">
  <title>Vigorix - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top, #1d1e33, #0a0a0b);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, rgba(45,46,74,0.8) 0%, rgba(15,16,38,0.9) 100%);
      border: 1px solid rgba(124,63,255,0.4);
      border-radius: 16px;
      box-shadow: 0 40px 60px -40px rgba(124,63,255,0.6);
      overflow: hidden;
    }
    .login-header {
      text-align: center;
      padding: 2rem 2rem 1rem;
    }
    .login-logo {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.4rem;
      text-transform: uppercase;
      color: var(--text-primary);
    }
    .login-subtitle {
      margin-top: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 0 2rem 2rem;
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .login-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .login-input {
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(203,213,225,0.2);
      background: rgba(15,16,38,0.8);
      color: var(--text-primary);
      font-size: 1rem;
    }
    .login-input:focus {
      outline: none;
      border-color: rgba(124,63,255,0.9);
      box-shadow: 0 0 0 4px rgba(124,63,255,0.18);
    }
    .login-btn {
      margin-top: 0.5rem;
      width: 100%;
      padding: 0.95rem 1rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, #7c3fff 0%, #22d3ee 100%);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .login-btn:disabled {
      opacity: 0.6;
    }
    .login-error {
      text-align: center;
      color: var(--danger);
      min-height: 1.2rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">Vigorix</div>
        <p class="login-subtitle">Acesse com seu e-mail e senha</p>
      </div>
      <form class="login-form" id="loginForm">
        <div class="login-field">
          <label class="login-label" for="email">E-mail</label>
          <input class="login-input" id="email" type="email" autocomplete="username" required>
        </div>
        <div class="login-field">
          <label class="login-label" for="password">Senha</label>
          <input class="login-input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="login-error" id="loginError"></div>
        <button class="login-btn" type="submit">
          <span>Entrar</span>
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { getSession, login } from './js/auth.js';
    import { syncNow } from './js/sync.js';

    const session = await getSession();
    if (session) {
      window.location.href = 'index.html';
    }

    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const errorEl = document.getElementById('loginError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        await login(email.value, password.value);
        await syncNow(true);
        window.location.href = 'index.html';
      } catch (err) {
        console.error(err);
        errorEl.textContent = err.message || 'Erro ao entrar';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
