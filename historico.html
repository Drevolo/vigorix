<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vigorix">

  <title>Histórico - Vigorix</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/history.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="history-top">
        <a href="index.html" class="history-back" aria-label="Voltar ao treino">
          <i data-lucide="arrow-left"></i>
        </a>
        <div class="logo">Histórico</div>
      </div>
      <div class="header-info">
        <span>Seu progresso ao longo do tempo</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="history-stats">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Treinos Realizados</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statDias">0</div>
        <div class="stat-label">Dias Distintos</div>
      </div>
    </section>

    <section class="history-filters">
      <button class="filter-btn active" data-view="calendario">Calendário</button>
      <button class="filter-btn" data-view="lista">Lista</button>
    </section>

    <section class="history-filters" id="filterRow" style="display: none;">
      <button class="filter-btn active" data-filter="todos">Todos</button>
      <button class="filter-btn" data-filter="hoje">Hoje</button>
      <button class="filter-btn" data-filter="7dias">Últimos 7 dias</button>
    </section>

    <section id="calendarView" class="calendar">
      <div class="calendar-nav">
        <button class="btn btn-secondary calendar-nav-btn" id="calPrev" aria-label="Mês anterior">
          <i data-lucide="chevron-left" class="icon-16"></i>
        </button>
        <div id="calMonthLabel" class="calendar-month"></div>
        <button class="btn btn-secondary calendar-nav-btn" id="calNext" aria-label="Próximo mês">
          <i data-lucide="chevron-right" class="icon-16"></i>
        </button>
      </div>
      <div class="calendar-weekdays">
        <div>Dom</div>
        <div>Seg</div>
        <div>Ter</div>
        <div>Qua</div>
        <div>Qui</div>
        <div>Sex</div>
        <div>Sáb</div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div class="calendar-legend">
        <span class="calendar-legend-dot"></span>
        <span>Dia com treino concluído</span>
      </div>
    </section>

    <section class="history-list" id="historyList" style="display: none;">
      <!-- Histórico será gerado pelo JavaScript -->
    </section>

    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-state-icon">· · ·</div>
      <div class="empty-state-title">Nenhum treino registrado ainda</div>
      <div class="empty-state-text">Complete seu primeiro treino para vê-lo aqui</div>
    </div>
  </main>

  <div id="detailModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Detalhes do Treino</h2>
        <button class="modal-close" id="detailClose">&times;</button>
      </div>
      <div class="modal-body" id="detailContent">
        <!-- Conteúdo gerado pelo JavaScript -->
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/history.js"></script>
</body>
</html>
